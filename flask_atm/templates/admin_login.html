{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-lg-4">
    <div class="atm-card atm-card-glow text-center">
      <div style="font-size:3rem;color:var(--atm-accent);margin-bottom:.5rem;">
        <i class="fas fa-shield-alt"></i>
      </div>
      <h4 class="section-title">Admin Login</h4> 
      <form method="POST">
        <div class="mb-3 text-start">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" placeholder="admin" required autofocus/>
        </div>
        <div class="mb-4 text-start">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn btn-atm w-100">
          <i class="fas fa-sign-in-alt me-2"></i>Login
        </button>
      </form>

      <p class="text-muted small mt-3">Default: admin / 123</p>
    </div>
  </div>
</div>
<div>
<a href="/" class="btn btn-sm btn-atm">User Login</a>
</div>
{% endblock %}
