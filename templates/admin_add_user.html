{% extends "base.html" %}
{% block title %}Add User{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="atm-card atm-card-glow">
      <h4 class="section-title"><i class="fas fa-user-plus me-2"></i>Add New User</h4>
      <form method="POST">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name *</label>
            <input type="text" name="name" class="form-control" placeholder="John Doe" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Date of Birth *</label>
            <input type="date" name="dob" class="form-control" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone *</label>
            <input type="text" name="phone" class="form-control" placeholder="+91 9876543210" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email *</label>
            <input type="email" name="email" class="form-control" placeholder="user@email.com" required/>
          </div>
          <div class="col-12">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control" rows="2" placeholder="Optional address"></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label">Account Type</label>
            <select name="saving_type" class="form-select">
              <option value="SAVINGS">Savings</option>
              <option value="CURRENT">Current</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">4-Digit PIN *</label>
            <input type="password" name="pin" class="form-control" maxlength="4"
                   placeholder="••••" pattern="[0-9]{4}" inputmode="numeric" required/>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-atm btn-atm-success flex-fill">
            <i class="fas fa-arrow-right me-2"></i>Create & Capture Face
          </button>
          <a href="/admin-dashboard/" class="btn btn-atm btn-atm-danger">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
