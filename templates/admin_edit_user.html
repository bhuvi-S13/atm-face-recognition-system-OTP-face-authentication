{% extends "base.html" %}
{% block title %}Edit User{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="atm-card atm-card-glow">
      <h4 class="section-title"><i class="fas fa-edit me-2"></i>Edit — {{ user['name'] }}</h4>
      <form method="POST">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" value="{{ user['phone'] }}" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ user['email'] }}" required/>
          </div>
          <div class="col-12">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control" rows="2">{{ user['address'] or '' }}</textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label">Account Type</label>
            <select name="saving_type" class="form-select">
              <option value="SAVINGS" {% if user['saving_type']=='SAVINGS' %}selected{% endif %}>Savings</option>
              <option value="CURRENT" {% if user['saving_type']=='CURRENT' %}selected{% endif %}>Current</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">New PIN (leave blank to keep)</label>
            <input type="password" name="new_pin" class="form-control" maxlength="4" placeholder="••••" inputmode="numeric"/>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-atm btn-atm-success flex-fill">
            <i class="fas fa-save me-2"></i>Save Changes
          </button>
          <a href="/admin-user/{{ user['id'] }}/" class="btn btn-atm btn-atm-danger">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
